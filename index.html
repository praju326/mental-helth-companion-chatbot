<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Companion Chatbot</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        header {
            background: #4a90e2;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
            scroll-behavior: smooth;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            animation: fadeIn 0.3s ease-in;
            position: relative;
        }
        .message.user {
            background: #4a90e2;
            color: #fff;
            align-self: flex-end;
            margin-left: auto;
        }
        .message.bot {
            background: #e0e0e0;
            color: #333;
            align-self: flex-start;
        }
        .message.typing {
            background: #f0f0f0;
            color: #666;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }
        .input-area {
            display: flex;
            padding: 20px;
            background: #fff;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.5);
        }
        button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: #357abd;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .clear-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .clear-btn:hover {
            background: #ff5252;
        }
        .disclaimer {
            padding: 10px 20px;
            background: #f0f0f0;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
        footer {
            padding: 10px 20px;
            background: #4a90e2;
            color: #fff;
            text-align: center;
            font-size: 0.8rem;
        }
        footer a {
            color: #fff;
            text-decoration: underline;
        }
        .icon {
            width: 20px;
            height: 20px;
            margin-right: 5px;
        }
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        .relaxation-img {
            width: 100px;
            height: 100px;
            margin: 10px auto;
            display: block;
        }
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        /* Responsive design */
        @media (max-width: 768px) {
            .container { height: 90vh; margin: 10px; }
            .message { max-width: 85%; font-size: 0.9rem; }
            header h1 { font-size: 1.3rem; }
            input, button { font-size: 0.9rem; }
            .input-area { flex-direction: column; align-items: stretch; }
            .clear-btn { align-self: center; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <img src="https://source.unsplash.com/featured/?meditation" alt="Calming Background" class="bg-image">
    <div class="container">
        <header>
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991235.png" alt="Mental Health Icon" class="icon">
            <h1>Mental Health Companion Chatbot</h1>
            <p>I'm here to listen and offer support.</p>
        </header>
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <img src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png" alt="Bot Avatar" class="icon">
                Hello! How are you feeling today?
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send <img src="https://cdn-icons-png.flaticon.com/512/2983/2983782.png" alt="Send Icon" class="icon"></button>
            <button class="clear-btn" onclick="clearChat()">Clear Chat <img src="https://cdn-icons-png.flaticon.com/512/1214/1214428.png" alt="Clear Icon" class="icon"></button>
        </div>
        <div class="disclaimer">
            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" alt="Help Icon" class="icon">
            This chatbot is for support only. If you're in crisis, call 988.
        </div>
        <footer>
            Resources: <a href="https://www.nami.org"><img src="https://www.nami.org/themes/nami/images/logo.png" alt="NAMI Logo" class="icon"></a>
            <img src="https://images.pexels.com/photos/3822622/pexels-photo-3822622.jpeg" alt="Relaxation Illustration" class="relaxation-img">
        </footer>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        function addMessage(sender, text, isTyping = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            if (isTyping) messageDiv.classList.add('typing');
            messageDiv.innerHTML = text;  // Use innerHTML for images
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            userInput.value = '';
            
            addMessage('bot', 'Typing...', true);
            
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                const typingMsg = chatBox.querySelector('.typing');
                if (typingMsg) typingMsg.remove();
                addMessage('bot', data.response);
            })
            .catch(() => {
                const typingMsg = chatBox.querySelector('.typing');
                if (typingMsg) typingMsg.remove();
                addMessage('bot', 'Sorry, something went wrong. Please try again.');
            });
        }

        function clearChat() {
            chatBox.innerHTML = '<div class="message bot"><img src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png" alt="Bot Avatar" class="icon">Chat cleared. Hello! How are you feeling today?</div>';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
